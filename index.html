<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>서태건 · Galaxy S24 Ultra</title>
<style>
:root{
  --bg:#0f1012;--bg2:#15161a;--card:#1b1c20;--card2:#24252a;--line:rgba(255,255,255,.07);
  --text:#ecebe6;--sub:#9a9aa1;--dim:#66666d;--plat:#d9d5cc;--accent:#e6d3a3;
  --red:#ef5350;--blue:#5b9cf0;--green:#35b07a;--sb:34px;--nb:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#060607;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;outline:none}
input{font:inherit;color:inherit}
.stage{height:100%;height:100dvh;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:560px) and (min-height:640px){
  #phone{width:392px;height:min(850px,calc(100% - 40px));border-radius:44px;box-shadow:0 0 0 9px #1a1b1e,0 0 0 10px #46474c,0 40px 90px rgba(0,0,0,.7)}
  .statusbar{padding-left:32px!important;padding-right:28px!important}
}
[data-action]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tap{transition:transform .12s ease,background-color .15s,opacity .15s}
.tap:active{transform:scale(.95)}
.press{transition:background-color .15s}
.press:active{background:rgba(255,255,255,.07)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ico{display:block;flex:0 0 auto}

/* status bar & nav */
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sb);padding:0 18px 0 22px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;z-index:75;pointer-events:none;color:#f2f2f2;font-variant-numeric:tabular-nums}
.statusbar *{pointer-events:none}
.sb-right{display:flex;gap:5px;align-items:center}
.sb-5g{font-size:11px;font-weight:700}
.navbar{position:absolute;left:0;right:0;bottom:0;height:var(--nb);display:flex;align-items:center;justify-content:space-around;z-index:70;background:rgba(10,10,11,.94)}
#phone.is-home .navbar{background:transparent}
#phone.is-lock .navbar{display:none}
.nav-btn{width:76px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:#e8e8e8}
.nav-btn:active{background:rgba(255,255,255,.12)}
.film{position:absolute;inset:0;z-index:90;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 12%,transparent 88%,rgba(0,0,0,.16))}

/* screens */
.screens{position:absolute;inset:0;z-index:1}
.screen{position:absolute;inset:0;padding-top:var(--sb);padding-bottom:var(--nb);display:flex;flex-direction:column;background:var(--bg);visibility:hidden;opacity:0;pointer-events:none;transform:scale(.985);transition:opacity .2s ease,transform .24s ease,visibility 0s linear .24s;z-index:1;overflow:hidden}
.screen.sub{transform:translateX(30px)}
.screen.active{visibility:visible;opacity:1;pointer-events:auto;transform:none;transition:opacity .2s ease,transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s;z-index:2}
#phone.is-lock .screen{padding-bottom:0}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.appbar{flex:0 0 auto;height:56px;display:flex;align-items:center;gap:2px;padding:0 6px}
.icon-btn{width:44px;height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:0 0 auto}
.icon-btn:active{background:rgba(255,255,255,.1)}
.appbar-title{flex:1;min-width:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.appbar-title small{font-size:13px;color:var(--sub);font-weight:500;margin-left:6px}
.hero{padding:22px 22px 14px}
.hero h1{font-size:27px;font-weight:700;letter-spacing:-.3px;word-break:keep-all}
.hero p{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.5;word-break:keep-all}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 20px;text-align:left}
.r-main{flex:1;min-width:0}
.r-title{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{font-size:12.5px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;white-space:nowrap}
.r-sub span{overflow:hidden;text-overflow:ellipsis}
.r-right{flex:0 0 auto;font-size:12px;color:var(--sub);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;background:#2b2d33;color:#d3d3d8}
.avatar.cat{background:linear-gradient(135deg,#f3e6d4,#e6d3a3);color:#7a5a3a}
.avatar.xl{width:96px;height:96px;font-size:36px}
.card{background:var(--card);border-radius:22px;margin:0 14px 12px;overflow:hidden}
.sec-label{font-size:12.5px;color:var(--sub);padding:14px 26px 8px;font-weight:600}
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--bg)}
.tabbar button{flex:1;min-height:52px;font-size:13.5px;color:var(--sub);font-weight:600;text-align:center;position:relative}
.tabbar button.on{color:var(--text)}
.tabbar button.on::after{content:"";position:absolute;left:50%;top:0;width:28px;height:2px;margin-left:-14px;background:var(--plat);border-radius:2px}
.chips{display:flex;gap:8px;padding:2px 14px 12px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--plat);color:#111;font-weight:600}
.empty{padding:60px 30px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7;word-break:keep-all}
.empty .ico{margin:0 auto 14px;opacity:.5}
.memo{font-size:12.5px;color:var(--dim);line-height:1.5;word-break:keep-all}
.kv{display:flex;justify-content:space-between;gap:16px;padding:14px 18px;font-size:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.kv:last-child{border-bottom:0}
.kv > span:first-child{color:var(--sub);flex:0 0 auto}
.kv > span:last-child{text-align:right;word-break:keep-all;min-width:0}

/* sheet & toast */
.sheet{position:absolute;inset:0;z-index:60;visibility:hidden;pointer-events:none;transition:visibility 0s linear .22s}
.sheet.open{visibility:visible;pointer-events:auto;transition:visibility 0s}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sheet.open .sheet-backdrop{opacity:1}
.sheet-panel{position:absolute;left:8px;right:8px;bottom:calc(var(--nb) + 8px);max-height:74%;overflow-y:auto;background:#1f2024;border-radius:26px;padding:22px 20px 16px;transform:translateY(24px);opacity:0;transition:transform .22s ease,opacity .2s}
.sheet.open .sheet-panel{transform:none;opacity:1}
.sh-title{font-size:18px;font-weight:700;word-break:keep-all}
.sh-sub{font-size:12.5px;color:var(--sub);margin-top:4px}
.sh-body{font-size:14px;line-height:1.65;color:#d2d2d6;margin-top:12px;word-break:keep-all}
.sh-actions{display:flex;gap:8px;margin-top:18px}
.sh-btn{flex:1;min-height:48px;border-radius:24px;background:#2d2e34;font-weight:600;text-align:center;font-size:14.5px}
.sh-btn.primary{background:var(--plat);color:#111}
.toast{position:absolute;left:50%;bottom:calc(var(--nb) + 26px);transform:translate(-50%,10px);width:max-content;max-width:84%;background:rgba(44,45,50,.97);color:#f3f3f3;padding:11px 18px;border-radius:20px;font-size:13.5px;opacity:0;transition:opacity .2s,transform .2s;z-index:80;pointer-events:none;text-align:center;line-height:1.45;word-break:keep-all}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* lock */
#s-lock{padding:0;background:#121315}
.geo{position:absolute;inset:0;pointer-events:none;background-color:#121315;
  background-image:linear-gradient(30deg,#18191c 12%,transparent 12.5%,transparent 87%,#18191c 87.5%,#18191c),linear-gradient(150deg,#18191c 12%,transparent 12.5%,transparent 87%,#18191c 87.5%,#18191c),linear-gradient(30deg,#18191c 12%,transparent 12.5%,transparent 87%,#18191c 87.5%,#18191c),linear-gradient(150deg,#18191c 12%,transparent 12.5%,transparent 87%,#18191c 87.5%,#18191c),linear-gradient(60deg,#1d1e22 25%,transparent 25.5%,transparent 75%,#1d1e22 75%,#1d1e22),linear-gradient(60deg,#1d1e22 25%,transparent 25.5%,transparent 75%,#1d1e22 75%,#1d1e22);
  background-size:44px 77px;background-position:0 0,0 0,22px 38px,22px 38px,0 0,22px 38px}
.geo::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 20%,rgba(0,0,0,.65) 100%)}
.lock-hit{position:absolute;inset:0;width:100%;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sb) + 64px) 20px 36px;text-align:center;z-index:1}
.lock-time{font-size:86px;font-weight:200;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.lock-date{font-size:16px;margin-top:12px;color:#d0d0d5}
.lock-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;color:#bdbdc3;font-size:13px}
.fp{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);animation:fp 2.4s ease-in-out infinite}

/* home */
#s-home{background:#0b0a0a}
.wall{position:absolute;inset:0;pointer-events:none;z-index:0}
.wall svg{display:block;width:100%;height:100%}
.home-wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:min-content;align-content:start;row-gap:10px;padding:8px 10px 0;overflow:hidden}
.widget{grid-column:1/-1;min-height:136px;padding:16px 12px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;text-shadow:0 1px 10px rgba(0,0,0,.55);border-radius:24px;text-align:left}
.w-time{font-size:54px;font-weight:300;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.w-date{font-size:14px;margin-top:8px;color:#e9e9ec}
.w-weather{text-align:right;font-size:12.5px;color:#e4e4e8;line-height:1.5}
.w-temp{font-size:26px;font-weight:300}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:86px;padding:6px 0;width:100%;min-width:0}
.ai{position:relative;width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);flex:0 0 auto}
.ai-text{font-weight:800;letter-spacing:-.3px;line-height:1.05;text-align:center}
.app-name{font-size:11.5px;max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f4f4f4;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.badge{position:absolute;top:-5px;right:-8px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#f2503f;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:none}
.dots{display:flex;justify-content:center;flex:0 0 auto;height:40px}
.dot-btn{width:44px;height:40px;display:flex;align-items:center;justify-content:center}
.dot{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.4);transition:width .2s,background .2s}
.dot-btn.on .dot{background:#fff;width:18px}
.dock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:2px 10px 8px;flex:0 0 auto}
.dock .app{min-height:66px}
@media (max-width:340px){.ai{width:48px;height:48px;border-radius:15px}.w-time{font-size:44px}.lock-time{font-size:70px}}

/* phone app */
.ct-in{color:#6fb3ff}.ct-out{color:#7ad1a3}.ct-miss{color:var(--red)}
.miss-name{color:var(--red)}
.dial-display{height:84px;font-size:32px;text-align:center;letter-spacing:2px;display:flex;align-items:center;justify-content:center;padding:0 20px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 30px;max-width:380px;margin:0 auto}
.key{min-height:62px;border-radius:31px;font-size:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.key small{font-size:10px;color:var(--sub);letter-spacing:1px}
.key:active{background:rgba(255,255,255,.09)}
.dial-actions{display:grid;grid-template-columns:1fr 66px 1fr;align-items:center;justify-items:center;padding:14px 30px;max-width:380px;margin:0 auto}
.call-fab{width:66px;height:66px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff}
.profile-top{display:flex;flex-direction:column;align-items:center;padding:20px 20px 16px}
.pt-name{font-size:24px;font-weight:700;margin-top:14px;text-align:center;word-break:keep-all}
.pt-sub{color:var(--sub);font-size:13.5px;margin-top:5px;text-align:center}
.quick{display:flex;justify-content:center;gap:12px;padding:6px 20px 18px}
.q-btn{width:76px;min-height:66px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}
#s-incall{background:linear-gradient(#1b2430,#0c0e11)}
.incall{flex:1;display:flex;flex-direction:column;align-items:center;padding:50px 24px 24px;min-height:0}
.ic-name{font-size:28px;font-weight:600;margin-top:18px;text-align:center;word-break:keep-all}
.ic-state{color:#9fb1c4;margin-top:8px;font-variant-numeric:tabular-nums}
.ic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto;width:100%;max-width:300px}
.ic-btn{min-height:72px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#cfd8e2}
.ic-btn.on{background:rgba(255,255,255,.16);color:#fff}
.end-btn{width:70px;height:70px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;margin-top:26px;color:#fff;flex:0 0 auto}

/* kakao */
#s-kakao,#s-kprofile{background:#191919}
.k-head{display:flex;align-items:center;padding:4px 6px 4px 20px;height:58px;flex:0 0 auto}
.k-head h1{font-size:21px;font-weight:700;flex:1}
.k-av{border-radius:17px}
.k-unread{background:#f2503f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:2px 7px}
.k-tag{display:inline-flex;color:var(--sub)}
.k-me{display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px;min-height:72px;text-align:left}
.k-me .avatar{width:56px;height:56px;border-radius:22px}
.def-av{background:#3a3b40;color:#76777d;overflow:hidden;align-items:flex-end}
#s-chatroom{background:#2b2f36}
.chat-body{padding:8px 12px 18px}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg-col{min-width:0;max-width:76%;display:flex;flex-direction:column;align-items:flex-start}
.msg.me .msg-col{align-items:flex-end}
.msg-name{font-size:12.5px;color:#c9ccd2;margin:2px 0 5px}
.bubble{background:#3d4149;color:#f1f1f1;padding:9px 12px;border-radius:4px 16px 16px 16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;word-break:keep-all}
.msg.me .bubble{background:#FEE500;color:#191919;border-radius:16px 4px 16px 16px}
.msg .avatar{width:38px;height:38px;border-radius:15px;font-size:14px}
.divider{text-align:center;margin:14px 0;font-size:12px;color:#c3c7cf}
.divider span{background:rgba(0,0,0,.28);padding:5px 12px;border-radius:12px;display:inline-block}
.sticker{display:block;width:124px;padding:2px;border-radius:14px}
.sticker.bounce svg{animation:bounce .6s ease}
.gift{display:block;width:216px;max-width:100%;border-radius:14px;overflow:hidden;background:#fff;color:#191919;text-align:left}
.gift-top{background:#FEE500;padding:10px 14px;font-weight:700;font-size:13px}
.gift-img{height:92px;background:linear-gradient(135deg,#25211d,#5b4c3c);color:#f1e6cc;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:3px}
.gift-info{padding:12px 14px 10px;font-size:12.5px;color:#555}
.gift-amt{font-size:18px;font-weight:800;color:#191919;margin-top:2px}
.gift-btn{border-top:1px solid #eee;padding:12px;text-align:center;font-size:13px;font-weight:600}
.chat-input{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 6px;background:#1f2227}
.ci-field{flex:1;min-width:0;min-height:44px;border-radius:22px;background:#2e3239;padding:0 14px;display:flex;align-items:center;color:#8a8f98;font-size:14px;text-align:left}
.ci-send{width:44px;height:44px;border-radius:50%;background:#FEE500;color:#191919;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.emo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.emo{min-height:88px;border-radius:18px;background:#2a2b31;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:34px}
.emo small{font-size:11px;color:var(--sub)}
.kp-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 20px 30px;background:linear-gradient(#2a2b2f,#141416)}
.kp-av{width:104px;height:104px;border-radius:40px}
.kp-name{font-size:21px;font-weight:700;margin-top:14px}
.kp-status{min-height:20px;font-size:13px;color:var(--sub);margin-top:6px}
.kp-actions{display:flex;gap:26px;margin-top:30px;border-top:1px solid var(--line);padding-top:20px;width:100%;justify-content:center}
.kp-actions button{min-width:72px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;border-radius:16px}

/* notes */
.note-card{display:block;width:calc(100% - 28px);margin:0 14px 10px;background:var(--card);border-radius:20px;padding:16px 18px;text-align:left}
.nc-title{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-prev{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nc-meta{font-size:11.5px;color:var(--dim);margin-top:8px}
.note-paper{padding:6px 24px 40px;font-size:15.5px;line-height:1.85;word-break:keep-all}
.note-paper h2{font-size:22px;margin-bottom:14px}
.note-paper ul{list-style:none}
.note-paper li{padding-left:22px;position:relative;margin-bottom:6px}
.note-paper li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.note-paper .tip{display:block;font-size:13.5px;color:var(--accent);margin-top:2px}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}

/* gallery */
.g-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:0 2px 10px}
.thumb{position:relative;aspect-ratio:1/1;overflow:hidden;width:100%;display:block;background:#222}
.thumb:active{opacity:.7}
.thumb .art{position:absolute;inset:0}
.th-fav{position:absolute;right:5px;bottom:3px;font-size:12px;color:#ff8aa0;pointer-events:none}
.th-live{position:absolute;left:4px;top:4px;font-size:9px;font-weight:700;background:rgba(0,0,0,.4);padding:1px 4px;border-radius:4px;color:#fff;pointer-events:none}
.art{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.art .glyph{font-size:26px;position:relative;z-index:1}
.art.big .glyph{font-size:76px}
.figure{position:relative;width:44%;height:66%;margin-top:22%}
.figure::before{content:"";position:absolute;left:28%;top:0;width:44%;aspect-ratio:1/1;border-radius:50%;background:rgba(255,255,255,.42)}
.figure::after{content:"";position:absolute;left:0;right:0;bottom:-10%;height:52%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.32)}
.figure.blur{filter:blur(3px);transform:rotate(-14deg) translateX(8%)}
.knit{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 4px,transparent 4px 8px)}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(255,240,210,.5),transparent 55%)}
.paper{background:#ece9e2}
.doc{width:70%;height:78%;background:#fbfaf6;box-shadow:0 2px 8px rgba(0,0,0,.18);padding:8% 9%;display:flex;flex-direction:column;gap:6%;color:#333;overflow:hidden}
.doc b{font-size:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art.big .doc b{font-size:18px;letter-spacing:2px}
.doc i{display:block;height:2px;background:#c9c4b8;border-radius:1px}
.art.big .doc i{height:5px}
.doc i.s{width:60%}
.doc svg{width:100%;flex:1;min-height:0}
.map{background-color:#eef0e6;background-image:linear-gradient(#d8dccd 1px,transparent 1px),linear-gradient(90deg,#d8dccd 1px,transparent 1px);background-size:14px 14px}
.map svg{position:absolute;inset:8%;width:84%;height:84%}
.map-label{position:absolute;left:6%;top:6%;font-size:8px;background:#fff;color:#333;padding:1px 4px;border-radius:3px}
.art.big .map-label{font-size:15px;padding:4px 10px}
#s-photo{background:#000}
.viewer{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 8px;position:relative}
.v-frame{position:relative;height:100%;max-height:540px;aspect-ratio:3/4;max-width:100%;border-radius:4px;overflow:hidden;display:block}
.v-frame .art{position:absolute;inset:0}
.v-frame.playing .art{animation:live 3s ease}
.v-live{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:10px;z-index:2;pointer-events:none}
.v-nav{position:absolute;top:50%;margin-top:-32px;width:44px;height:64px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border-radius:14px;z-index:3;color:#fff}
.v-nav.l{left:6px}.v-nav.r{right:6px}
.v-nav[disabled]{opacity:.25}
.v-cap{padding:10px 20px 4px;font-size:14px;text-align:center;color:#ddd;word-break:keep-all;flex:0 0 auto}
.v-bar{display:flex;justify-content:space-around;padding:2px 10px 4px;flex:0 0 auto}
.fav-on{color:#ff6f8f}

/* internet / web */
.searchbar{display:flex;align-items:center;gap:4px;margin:6px 14px 10px;background:var(--card);border-radius:24px;padding:0 2px 0 16px;min-height:48px;flex:0 0 auto}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px;height:46px}
.searchbar input::placeholder{color:var(--dim)}
.url-bar{display:flex;align-items:center;gap:4px;padding:4px 6px;flex:0 0 auto}
.url{flex:1;min-width:0;min-height:42px;border-radius:21px;background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13.5px;color:#d0d0d5}
.webpage{padding:22px 20px 30px}
.webpage h2{font-size:21px;line-height:1.4;word-break:keep-all}
.webpage .meta{font-size:12px;color:var(--sub);margin:8px 0 18px}
.sk{height:12px;border-radius:6px;background:#25262b;margin:11px 0}
.sk.w60{width:60%}.sk.w80{width:80%}.sk.w40{width:40%}
.sk-img{height:150px;border-radius:16px;background:#202126;margin:18px 0}
.notice{margin-top:22px;padding:14px 16px;border-radius:16px;background:var(--card);font-size:13px;color:var(--sub);line-height:1.6;word-break:keep-all}

/* calendar */
.cal-head{display:flex;align-items:center;padding:2px 6px 4px 22px;flex:0 0 auto}
.cal-head h2{flex:1;font-size:22px;font-weight:700}
.cal-legend{display:flex;gap:14px;padding:0 22px 8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.cal-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 8px}
.cal-week div{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.cday{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;border-radius:14px;font-size:14px;gap:2px;width:100%}
.cday.sun{color:#ff8080}.cday.sat{color:#86b4ff}
.dn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cday.today .dn{background:var(--plat);color:#111;font-weight:700}
.cday.sel{background:rgba(255,255,255,.08)}
.ev-dot{width:6px;height:6px;border-radius:50%;background:#ff5a5a}
.ev-card{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;width:100%;text-align:left}
.ev-bar{width:4px;align-self:stretch;border-radius:2px;background:#ff5a5a;flex:0 0 auto}

/* clock */
.alarm{display:flex;align-items:center;width:calc(100% - 28px);margin:0 14px 10px;background:var(--card);border-radius:22px;padding:18px 20px;text-align:left;gap:12px}
.al-main{flex:1;min-width:0}
.al-time{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.al-time small{font-size:15px;margin-right:4px}
.al-label{font-size:13px;color:var(--accent);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-days{font-size:12.5px;color:var(--sub);margin-top:2px}
.alarm.off .al-time,.alarm.off .al-label{color:var(--dim)}
.sw{width:46px;height:28px;border-radius:14px;background:#3a3b40;position:relative;flex:0 0 auto;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#bbb;transition:left .2s,background .2s}
.sw.on{background:#4c7ef3}
.sw.on::after{left:21px;background:#fff}

/* settings */
.s-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.bar{height:8px;border-radius:4px;background:#2c2d32;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--plat);border-radius:4px}
.buzz{animation:buzz .45s ease}
.wp-prev{display:flex;gap:12px;margin-top:14px}
.wp-prev > div{flex:1;aspect-ratio:9/16;border-radius:16px;overflow:hidden;position:relative}
.wp-prev span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11.5px;color:#eee;z-index:2}
.wp-prev .geo{position:absolute}
.wp-prev svg{display:block;width:100%;height:100%}

/* generic apps */
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:14px}
.brand .ai{width:52px;height:52px;border-radius:16px;box-shadow:none}
.brand h1{font-size:20px;font-weight:700;word-break:keep-all}
.brand p{font-size:12.5px;color:var(--sub);margin-top:3px;word-break:keep-all}
.secure{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.secure .lock-ring{width:88px;height:88px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.secure p{color:var(--sub);font-size:13.5px;line-height:1.6;word-break:keep-all;margin-top:6px}
.wide-btn{display:block;width:calc(100% - 40px);max-width:320px;margin:22px auto 0;min-height:52px;border-radius:26px;background:var(--plat);color:#111;font-weight:700;text-align:center;font-size:15px}
.car-card{margin:6px 14px 12px;border-radius:26px;background:linear-gradient(160deg,#25272c,#101113);padding:20px 20px 24px;text-align:center}
.car-card svg{width:100%;max-width:300px;height:auto;margin:0 auto}
.start-btn{width:124px;height:124px;border-radius:50%;margin:18px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid #4b4c52;font-weight:700;font-size:14px;text-align:center}
.start-btn.on{border-color:var(--accent);box-shadow:0 0 34px rgba(230,211,163,.28);color:var(--accent)}
.start-btn.pending{animation:pulse 1s ease-in-out infinite}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px}
.svc{min-height:120px;border-radius:22px;background:var(--card);padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.svc b{font-size:17px}
.svc span{font-size:12px;color:var(--sub)}
.thumb-ico{width:52px;height:52px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}

/* recents */
#s-recents{background:#0c0c0e}
.rc-list{display:flex;gap:14px;overflow-x:auto;padding:26px 24px 20px;scroll-snap-type:x mandatory;flex:1;min-height:0;align-items:center;scrollbar-width:none}
.rc-list::-webkit-scrollbar{display:none}
.rc-card{flex:0 0 70%;height:88%;max-height:480px;border-radius:24px;background:var(--card);scroll-snap-align:center;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.rc-top{display:flex;align-items:center;gap:10px;padding:14px;font-weight:600;font-size:14px}
.rc-top .ai{width:32px;height:32px;border-radius:10px;box-shadow:none}
.rc-top .ai .ico{width:18px;height:18px}
.rc-top .ai-text{font-size:9px!important}
.rc-body{flex:1;background:var(--bg2);margin:0 10px 10px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.rc-close{display:block;margin:0 auto 14px;min-height:44px;padding:0 26px;border-radius:22px;background:var(--card);font-size:14px;flex:0 0 auto}

@keyframes blink{50%{opacity:0}}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-10px) scale(1.05)}60%{transform:translateY(0) scale(.97)}}
@keyframes live{0%{transform:scale(1)}20%{transform:scale(1.04)}50%{transform:scale(1.02) rotate(.6deg)}100%{transform:scale(1)}}
@keyframes buzz{0%,100%{transform:none}15%{transform:translateX(-4px)}30%{transform:translateX(4px)}45%{transform:none}60%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes fp{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.12)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    if (head === 'catch') {
      var c = CATCH[parseInt(arg, 10)] || CATCH[0];
      return '<div class="sh-title">' + esc(c.area) + ' · ' + esc(c.kind) + '</div><div class="sh-sub">캐치테이블 · 지난 예약</div>' +
        '<div class="sh-actions"><button class="sh-btn" data-action="closeSheet">닫기</button><button class="sh-btn primary" data-action="toast" data-msg="열람 모드에서는 예약할 수 없어요">다시 예약</button></div>';
    }
    if (head === 'set') {
      if (arg === 'device') return '<div class="sh-title">휴대전화 정보</div><div class="card" style="margin:14px 0 0">' +
        '<div class="kv"><span>모델</span><span>Galaxy S24 Ultra</span></div><div class="kv"><span>색상</span><span>티타늄 블랙</span></div>' +
        '<div class="kv"><span>용량</span><span>512GB</span></div><div class="kv"><span>외관</span><span>케이스 없음 · 사생활 보호 필름 · 모서리 미세 생활 기스</span></div></div>' + close;
      if (arg === 'storage') return '<div class="sh-title">저장공간</div><div class="sh-body">89GB 사용 중 / 512GB</div><div class="bar"><i style="width:17.4%"></i></div>' + close;
      if (arg === 'battery') return '<div class="sh-title">배터리</div><div class="sh-body">78%</div><div class="bar"><i style="width:78%"></i></div>' + close;
      if (arg === 'sound') return '<div class="sh-title">소리 및 진동</div><div class="card" style="margin:14px 0 0">' +
        '<div class="kv"><span>모드</span><span>진동 고정</span></div><div class="kv"><span>예외</span><span>내 고양이 · 무음 해제</span></div><div class="kv"><span>전용 진동</span><span>짧게 두 번</span></div></div>' +
        '<div class="sh-actions"><button class="sh-btn" data-action="closeSheet">닫기</button><button class="sh-btn primary" data-action="vibrate">진동 미리보기</button></div>';
      if (arg === 'wall') return '<div class="sh-title">배경화면</div><div class="wp-prev">' +
        '<div><div class="geo"></div><span>잠금 화면 · 기본 기하학 패턴</span></div>' +
        '<div>' + wallSVG('w') + '<span>홈 화면 · 커플링 낀 차영의 손</span></div></div>' + close;
    }
    return '<div class="sh-title">정보</div>' + close;
  }
  function openSheet(key) {
    sheetPanel.innerHTML = sheetContent(key);
    sheet.classList.add('open');
  }
  function closeSheet() { sheet.classList.remove('open'); }
  function sheetOpen() { return sheet.classList.contains('open'); }

  /* ---------- 토스트 ---------- */
  var toastTimer = null;
  function showToast(msg) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1900);
  }

  /* ---------- 화면 전환 ---------- */
  var STATIC = { lock: 1, home: 1 };
  var stack = [{ id: 'lock', param: '' }];
  var current = null;
  var lastNav = 0;

  function guard() {
    var n = Date.now();
    if (n - lastNav < 180) return false;
    lastNav = n;
    return true;
  }

  function renderInto(entry, el) {
    if (STATIC[entry.id]) {
      if (!el.getAttribute('data-ready')) {
        el.innerHTML = R[entry.id]();
        el.setAttribute('data-ready', '1');
        afterStatic(entry.id, el);
      }
      return;
    }
    try {
      el.innerHTML = R[entry.id](entry.param);
    } catch (err) {
      el.innerHTML = appbar('오류') + '<div class="body"><div class="empty">화면을 불러오지 못했어요.</div></div>';
      if (window.console) console.error(err);
    }
    var b = el.querySelector('.body');
    if (b) {
      if (entry.scroll != null) b.scrollTop = entry.scroll;
      else if (entry.id === 'chatroom') b.scrollTop = b.scrollHeight;
    }
    if (entry.id === 'incall') startCallTimer();
    if (entry.id === 'clock') updateNextAlarm();
    safeTick();
  }

  function show() {
    var entry = stack[stack.length - 1];
    var el = document.getElementById('s-' + entry.id);
    if (!el || !R[entry.id]) { stack.pop(); if (!stack.length) stack.push({ id: 'home', param: '' }); return show(); }
    if (current && current !== entry) {
      var pel = document.getElementById('s-' + current.id);
      var pb = pel && pel.querySelector('.body');
      if (pb) current.scroll = pb.scrollTop;
      if (current.id === 'incall' && entry.id !== 'incall') stopCallTimer();
    }
    renderInto(entry, el);
    var act = document.querySelectorAll('.screen.active');
    for (var i = 0; i < act.length; i++) if (act[i] !== el) act[i].classList.remove('active');
    el.classList.add('active');
    phone.classList.toggle('is-lock', entry.id === 'lock');
    phone.classList.toggle('is-home', entry.id === 'home');
    current = entry;
  }

  function rerender() {
    var entry = stack[stack.length - 1];
    var el = document.getElementById('s-' + entry.id);
    if (!el || STATIC[entry.id]) return;
    var b = el.querySelector('.body');
    entry.scroll = b ? b.scrollTop : null;
    renderInto(entry, el);
  }

  function openScreen(id, param) {
    if (!R[id] || !document.getElementById('s-' + id)) return;
    if (!guard()) return;
    closeSheet();
    var top = stack[stack.length - 1];
    var p = param == null ? '' : String(param);
    if (top.id === id && top.param === p) return;
    stack.push({ id: id, param: p });
    show();
  }
  function goBack() {
    if (sheetOpen()) { closeSheet(); return; }
    if (!guard()) return;
    var top = stack[stack.length - 1];
    if (top.id === 'lock' || top.id === 'home') return;
    stack.pop();
    if (!stack.length) stack.push({ id: 'home', param: '' });
    show();
  }
  function goHome() {
    closeSheet();
    lastNav = Date.now();
    stack = [{ id: 'home', param: '' }];
    show();
  }
  function lockNow() {
    closeSheet();
    lastNav = Date.now();
    stack = [{ id: 'lock', param: '' }];
    show();
  }
  function addRecent(key) {
    S.recents = S.recents.filter(function (k) { return k !== key; });
    S.recents.unshift(key);
    if (S.recents.length > 8) S.recents.length = 8;
  }
  function openApp(key, fromHome) {
    var a = APPS[key];
    if (!a) return;
    closeSheet();
    lastNav = Date.now();
    addRecent(key);
    var entry = { id: a.screen, param: a.param || '' };
    if (fromHome) {
      var top = stack[stack.length - 1];
      if (top.id === entry.id && top.param === entry.param) return;
      stack = [{ id: 'home', param: '' }, entry];
    } else {
      stack = [{ id: 'home', param: '' }, entry];
    }
    show();
  }

  /* ---------- 통화 타이머 ---------- */
  var callTimer = null;
  function stopCallTimer() { if (callTimer) { clearInterval(callTimer); callTimer = null; } }
  function startCallTimer() {
    stopCallTimer();
    var start = Date.now() + 1200;
    callTimer = setInterval(function () {
      var e = document.querySelector('#s-incall .js-calltimer');
      if (!e) { stopCallTimer(); return; }
      var s = Math.floor((Date.now() - start) / 1000);
      e.textContent = s < 0 ? '연결 중…' : pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    }, 250);
  }

  /* ---------- 홈 페이지 점 ---------- */
  function afterStatic(id, el) {
    if (id !== 'home') return;
    var pages = el.querySelector('#pages');
    if (!pages) return;
    var ticking = false;
    pages.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        var w = pages.clientWidth || 1;
        var idx = Math.round(pages.scrollLeft / w);
        var dots = el.querySelectorAll('.dot-btn');
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === idx);
      });
    }, { passive: true });
  }
  function goPage(i) {
    var pages = document.getElementById('pages');
    if (!pages) return;
    var left = pages.clientWidth * i;
    try { pages.scrollTo({ left: left, behavior: 'smooth' }); } catch (e) { pages.scrollLeft = left; }
    var dots = document.querySelectorAll('#s-home .dot-btn');
    for (var d = 0; d < dots.length; d++) dots[d].classList.toggle('on', d === i);
  }

  /* ---------- 장식: 시계 ---------- */
  function safeTick() {
    try {
      var d = new Date();
      var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
      var ds = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일';
      var ts = document.querySelectorAll('.js-time');
      for (var i = 0; i < ts.length; i++) if (ts[i].textContent !== t) ts[i].textContent = t;
      var dd = document.querySelectorAll('.js-date');
      for (var j = 0; j < dd.length; j++) if (dd[j].textContent !== ds) dd[j].textContent = ds;
    } catch (e) { /* 장식 요소 오류는 무시 */ }
  }
  function updateNextAlarm() {
    try {
      var e = document.querySelector('#s-clock .js-nextalarm');
      if (!e) return;
      var on = S.alarms.filter(Boolean).length;
      e.textContent = on ? '켜진 알람 ' + on + '개' : '모든 알람이 꺼져 있습니다';
    } catch (err) { /* 무시 */ }
  }

  /* ---------- 액션 처리 ---------- */
  function handleSearch(input) {
    var v = input ? String(input.value || '').trim() : '';
    showToast(v ? '‘' + v + '’ · 열람 모드에서는 새 검색을 할 수 없어요' : '검색어를 입력하세요');
  }

  function vibrate(t) {
    try { if (navigator.vibrate) navigator.vibrate([70, 90, 70]); } catch (e) { /* 무시 */ }
    var target = (t && t.closest('.card')) || t;
    if (target) {
      target.classList.remove('buzz');
      void target.offsetWidth;
      target.classList.add('buzz');
    }
    showToast('내 고양이 전용 진동 · 짧게 두 번');
  }

  var ACTIONS = {
    unlock: function () { goHome(); },
    app: function (t) { openApp(t.getAttribute('data-app'), true); },
    open: function (t) { openScreen(t.getAttribute('data-target'), t.getAttribute('data-param') || ''); },
    back: function () { goBack(); },
    home: function () { goHome(); },
    recents: function () {
      if (stack[stack.length - 1].id === 'lock') return;
      if (stack[stack.length - 1].id === 'recents') { goBack(); return; }
      openScreen('recents', '');
    },
    recentOpen: function (t) { openApp(t.getAttribute('data-app'), false); },
    clearRecents: function () { S.recents = []; rerender(); showToast('모든 앱을 닫았습니다'); },
    tab: function (t) {
      var key = t.getAttribute('data-key');
      if (!Object.prototype.hasOwnProperty.call(S, key)) return;
      S[key] = t.getAttribute('data-param');
      var top = stack[stack.length - 1];
      top.scroll = 0;
      var el = document.getElementById('s-' + top.id);
      if (el) renderInto(top, el);
    },
    page: function (t) { goPage(parseInt(t.getAttribute('data-param'), 10) || 0); },
    toast: function (t) { showToast(t.getAttribute('data-msg')); },
    sheet: function (t) { openSheet(t.getAttribute('data-param')); },
    closeSheet: function () { closeSheet(); },
    openRoom: function (t) { closeSheet(); lastNav = 0; openScreen('chatroom', t.getAttribute('data-param')); },
    photoNav: function (t) {
      if (t.hasAttribute('disabled')) return;
      var top = stack[stack.length - 1];
      if (top.id !== 'photo') return;
      var o = parsePhoto(top.param);
      var ni = o.i + (parseInt(t.getAttribute('data-param'), 10) || 0);
      if (ni < 0 || ni >= o.list.length) return;
      top.param = o.tab + ':' + ni;
      top.scroll = null;
      renderInto(top, document.getElementById('s-photo'));
    },
    livePlay: function (t) {
      t.classList.remove('playing');
      void t.offsetWidth;
      t.classList.add('playing');
      setTimeout(function () { t.classList.remove('playing'); }, 3000);
    },
    calNav: function (t) {
      var d = parseInt(t.getAttribute('data-param'), 10) || 0;
      if (d === 0) {
        S.calY = TODAY.getFullYear(); S.calM = TODAY.getMonth();
        S.calSel = dateKey(S.calY, S.calM, TODAY.getDate());
      } else {
        var m = S.calM + d;
        S.calY += Math.floor(m / 12);
        S.calM = ((m % 12) + 12) % 12;
        S.calSel = dateKey(S.calY, S.calM, 1);
        if (S.calY === 2026 && S.calM === 11) S.calSel = '2026-12-25';
      }
      rerender();
    },
    calDay: function (t) { S.calSel = t.getAttribute('data-param'); rerender(); },
    alarm: function (t) {
      var i = parseInt(t.getAttribute('data-param'), 10) || 0;
      S.alarms[i] = !S.alarms[i];
      rerender();
      showToast(S.alarms[i] ? '알람이 켜졌습니다' : '알람이 꺼졌습니다');
    },
    vibrate: function (t) { vibrate(t); },
    lock: function () { lockNow(); },
    call: function (t) { openScreen('incall', t.getAttribute('data-param')); },
    endcall: function () { stopCallTimer(); showToast('통화가 종료되었습니다'); goBack(); },
    toggleBtn: function (t) { t.classList.toggle('on'); },
    dial: function (t) {
      if (S.dial.length >= 16) return;
      S.dial += t.getAttribute('data-param');
      var e = document.querySelector('#s-phone .js-dial');
      if (e) e.textContent = S.dial;
    },
    dialDel: function () {
      S.dial = S.dial.slice(0, -1);
      var e = document.querySelector('#s-phone .js-dial');
      if (e) e.textContent = S.dial;
    },
    dialCall: function () {
      if (!S.dial) { showToast('번호를 입력하세요'); return; }
      openScreen('incall', S.dial);
    },
    genesis: function () {
      if (S.genesis === 1) return;
      if (S.genesis === 2) { S.genesis = 0; rerender(); showToast('원격 시동이 꺼졌습니다'); return; }
      S.genesis = 1;
      rerender();
      setTimeout(function () {
        S.genesis = 2;
        if (stack[stack.length - 1].id === 'genesis') rerender();
        showToast('원격 시동이 걸렸습니다');
      }, 1300);
    },
    bounce: function (t) {
      t.classList.remove('bounce');
      void t.offsetWidth;
      t.classList.add('bounce');
    },
    search: function (t) {
      var bar = t.closest('.searchbar');
      handleSearch(bar ? bar.querySelector('input') : null);
    }
  };

  phone.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || !phone.contains(t)) return;
    var fn = ACTIONS[t.getAttribute('data-action')];
    if (!fn) return;
    e.preventDefault();
    try { fn(t, e); } catch (err) { if (window.console) console.error(err); }
  });

  phone.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('input[data-enter]')) {
      e.preventDefault();
      handleSearch(e.target);
      try { e.target.blur(); } catch (err) { /* 무시 */ }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') goBack();
  });

  /* ---------- 시작 ---------- */
  function init() {
    show();
    safeTick();
    setInterval(safeTick, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
